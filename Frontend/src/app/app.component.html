@if (isLoading) {
  <div class="loading-screen" role="status" aria-label="Loading">
    <span class="loading-spinner" aria-hidden="true"></span>
  </div>
} @else {
  @if (showHeader) {
    <app-header></app-header>
  }

  @if (showTopBar) {
    <app-top-bar></app-top-bar>
  }

  <main>
    <router-outlet></router-outlet>
  </main>

  @if (showFooter) {
    <app-footer></app-footer>
  }

  @if (showQuickRebook) {
    <app-quick-rebook-modal
      [isOpen]="quickRebookOpen"
      [appointment]="quickRebookAppointment"
      (rebook)="quickRebook()"
      (dismiss)="dismissQuickRebook()"
    ></app-quick-rebook-modal>
  }
}
