<div class="sign-in-container" [style]="tenantStyles()">
  <h2>Sign In</h2>
  <form [formGroup]="signInForm" (ngSubmit)="onSignIn()">
    <div class="form-group">
      <label for="email">Email</label>
      <input
        id="email"
        formControlName="email"
        placeholder="Enter your email"
        class="form-control"
        type="email"
      />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <div class="password-input-container">
        <input
          id="password"
          [type]="passwordVisible ? 'text' : 'password'"
          formControlName="password"
          placeholder="Enter your password"
          class="form-control"
        />
        <button
          type="button"
          class="visibility-toggle"
          (click)="togglePasswordVisibility()"
          tabindex="-1"
        >
          <i [class]="passwordVisible ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
        </button>
      </div>
    </div>
    <app-action-button
      buttonType="submit"
      [config]="signInActionConfig"
      [isLoading]="signInLoading"
    ></app-action-button>
    <div *ngIf="loginError" class="form-error">{{ loginError }}</div>
  </form>
  <div class="form-links">
    <a (click)="onForgotPassword()" class="forgot-link">Forgot password?</a>
    <a (click)="onRegister()" class="register-link">Not registered yet?</a>
  </div>
</div>
