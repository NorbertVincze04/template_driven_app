<div class="sign-in-container" [style]="tenantStyles()">
  <button
    type="button"
    class="theme-toggle"
    [attr.aria-label]="
      tenantService.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'
    "
    [attr.title]="
      tenantService.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'
    "
    (click)="tenantService.toggleThemeMode()"
  >
    @if (tenantService.isDarkMode()) {
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2" />
        <path d="M12 20v2" />
        <path d="m4.93 4.93 1.41 1.41" />
        <path d="m17.66 17.66 1.41 1.41" />
        <path d="M2 12h2" />
        <path d="M20 12h2" />
        <path d="m6.34 17.66-1.41 1.41" />
        <path d="m19.07 4.93-1.41 1.41" />
      </svg>
    } @else {
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    }
  </button>
  <h2>Sign In</h2>
  <form [formGroup]="signInForm" (ngSubmit)="onSignIn()">
    <div class="form-group">
      <label for="email">Email</label>
      <input
        id="email"
        formControlName="email"
        placeholder="Enter your email"
        class="form-control"
        type="email"
      />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <div class="password-input-container">
        <input
          id="password"
          [type]="passwordVisible ? 'text' : 'password'"
          formControlName="password"
          placeholder="Enter your password"
          class="form-control"
        />
        <button
          type="button"
          class="visibility-toggle"
          (click)="togglePasswordVisibility()"
          tabindex="-1"
        >
          <i [class]="passwordVisible ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
        </button>
      </div>
    </div>
    <app-action-button
      buttonType="submit"
      [config]="signInActionConfig"
      [isLoading]="signInLoading"
    ></app-action-button>
    <div *ngIf="loginError" class="form-error">{{ loginError }}</div>
  </form>
  <div class="form-links">
    <a (click)="onForgotPassword()" class="forgot-link">Forgot password?</a>
    <a (click)="onRegister()" class="register-link">Not registered yet?</a>
    <a routerLink="/home" class="register-link">Continue without an account.</a>
  </div>
</div>
