<div class="guest-fields" [formGroup]="group">
  <div class="form-group">
    <label for="guestName">Your name</label>
    <input
      id="guestName"
      formControlName="guestName"
      autocomplete="name"
      class="form-control"
      placeholder="Enter your name"
    />
    <div
      *ngIf="
        group.get('guestName')?.invalid &&
        (group.get('guestName')?.touched || submitted)
      "
      class="field-error"
    >
      <span *ngIf="group.get('guestName')?.errors?.['required']"
        >Name is required.</span
      >
    </div>
  </div>

  <div class="form-group">
    <label for="guestEmail">Email</label>
    <input
      id="guestEmail"
      type="email"
      formControlName="guestEmail"
      autocomplete="email"
      class="form-control"
      placeholder="Enter your email"
    />
    <div
      *ngIf="
        group.get('guestEmail')?.invalid &&
        (group.get('guestEmail')?.touched || submitted)
      "
      class="field-error"
    >
      <span *ngIf="group.get('guestEmail')?.errors?.['required']"
        >Email is required.</span
      >
      <span *ngIf="group.get('guestEmail')?.errors?.['email']"
        >Enter a valid email address.</span
      >
    </div>
  </div>

  <div class="form-group">
    <label for="guestPhone">Phone</label>
    <input
      id="guestPhone"
      formControlName="guestPhone"
      autocomplete="tel"
      inputmode="numeric"
      minlength="10"
      maxlength="10"
      class="form-control"
      placeholder="07..."
      type="tel"
    />
    <div
      *ngIf="
        group.get('guestPhone')?.invalid &&
        (group.get('guestPhone')?.touched || submitted)
      "
      class="field-error"
    >
      <span *ngIf="group.get('guestPhone')?.errors?.['required']"
        >Phone number is required.</span
      >
      <span *ngIf="group.get('guestPhone')?.errors?.['pattern']"
        >Use 10 digits, for example 07...</span
      >
    </div>
  </div>
</div>
