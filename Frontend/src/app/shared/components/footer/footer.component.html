<footer class="footer" [style]="tenantStyles()">
  <!-- Left -->
  <div class="footer-left">
    <p class="powered-by">powered by VNI</p>
  </div>

  <!-- Right -->
  <div class="footer-right">
    @if (tenantConfig()?.layout?.footer?.showHelpCenter !== false) {
      <a routerLink="/help" class="help-btn">Help Center</a>
    }

    @if (tenantConfig()?.layout?.footer?.showInstagram !== false) {
      <a href="#" class="social-btn" aria-label="Instagram">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37" />
          <circle cx="17.5" cy="6.5" r="1.5" />
        </svg>
      </a>
    }

    @if (tenantConfig()?.layout?.footer?.showFacebook !== false) {
      <a href="#" class="social-btn" aria-label="Facebook">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M18 2h-3a6 6 0 0 0-6 6v3H7v4h2v8h4v-8h3l1-4h-4V8a2 2 0 0 1 2-2h3z"
          />
        </svg>
      </a>
    }
  </div>
</footer>
