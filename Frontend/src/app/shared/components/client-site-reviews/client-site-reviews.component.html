<section id="reviews" [style]="tenantStyles()">
  <div class="reviews-container">
    <div class="reviews-header">
      <div class="header-content">
        <p class="section-label">{{ reviewsContent().sectionLabel }}</p>
        <h2 class="section-title">{{ reviewsContent().title }}</h2>
        <p class="section-description">{{ reviewsContent().description }}</p>
      </div>

      <div class="header-actions">
        <div class="rating-summary">
          <div class="summary-score">
            <span class="score-num">{{ averageRating() }}</span>
            <div class="stars" aria-label="Average Rating">
              @for (star of [1, 2, 3, 4, 5]; track star) {
                <svg
                  class="star-icon"
                  [class.filled]="star <= +averageRating()"
                  viewBox="0 0 24 24"
                >
                  <polygon
                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
                  />
                </svg>
              }
            </div>
          </div>
          <span class="summary-count">
            Based on {{ reviewsList().length }}
            {{ reviewsList().length === 1 ? "review" : "reviews" }}
          </span>
        </div>

        <app-action-button
          [config]="{
            label: 'Leave a Review',
            variant: 'primary',
            size: 'md',
          }"
          (action)="openReviewModal()"
        ></app-action-button>
      </div>
    </div>

    <!-- Grid/empty-state rendering is delegated to the reusable reviews-list component -->
    <app-reviews-list
      [reviews]="reviewsList()"
      (writeReview)="openReviewModal()"
    ></app-reviews-list>
  </div>
</section>

<!-- Review submission dialog is a self-contained, reusable modal component -->
<app-review-form-modal
  [isOpen]="isModalOpen()"
  [errorMessage]="submitError()"
  (submitReview)="handleReviewSubmit($event)"
  (closeModal)="closeReviewModal()"
></app-review-form-modal>
