<div class="notifications-menu">
  <button
    class="icon-btn"
    type="button"
    aria-label="Notifications"
    [attr.aria-expanded]="isOpen"
    (click)="$event.stopPropagation(); toggle()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
      <path d="M13.73 21a2 2 0 0 1-3.46 0" />
    </svg>
    @if (unreadCount() > 0) {
      <span class="notification-badge">{{
        unreadCount() > 9 ? "9+" : unreadCount()
      }}</span>
    }
  </button>
  @if (isOpen) {
    <div class="notification-dropdown" role="menu">
      <div class="notification-dropdown-header">
        <strong>Notifications</strong>
        @if (unreadCount() > 0) {
          <button
            type="button"
            class="mark-all-read-btn"
            (click)="markAllRead($event)"
          >
            Mark all as read
          </button>
        }
      </div>
      <div class="notification-list">
        @for (notification of notifications(); track notification.id) {
          <div
            class="notification-item"
            role="menuitem"
            tabindex="0"
            [class.unread]="!notification.isRead"
            (click)="onNotificationClick(notification)"
            (keydown)="onNotificationKeydown($event, notification)"
          >
            <span class="notification-item-title">{{
              notification.title
            }}</span>
            <span
              class="notification-item-message"
              [title]="notification.message"
              >{{ notification.message }}</span
            >
            <span class="notification-item-time">{{
              timeAgo(notification.createdAt)
            }}</span>
            <button
              type="button"
              class="notification-delete-btn"
              aria-label="Delete notification"
              title="Delete notification"
              (click)="deleteNotification($event, notification.id)"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
              >
                <path d="M3 6h18" />
                <path d="M8 6V4h8v2" />
                <path d="M19 6l-1 14H6L5 6" />
                <path d="M10 10v6M14 10v6" />
              </svg>
            </button>
          </div>
        } @empty {
          <div class="notification-empty">
            You're all caught up - no notifications yet.
          </div>
        }
      </div>
    </div>
  }
</div>
