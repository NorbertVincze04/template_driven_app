<button
  [type]="buttonType"
  (click)="onAction()"
  [disabled]="config.disabled || isLoading"
  [class]="'btn-' + (config.variant || 'primary')"
  [style]="tenantStyles()"
>
  @if (isLoading) {
    <span class="spinner"></span>
  }

  @if (icon) {
    <ng-container *ngTemplateOutlet="icon"></ng-container>
    <span>{{ displayLabel }}</span>
  } @else {
    @if (config.icon) {
      <i [class]="config.icon"></i>
    }
    {{ displayLabel }}
  }
</button>
