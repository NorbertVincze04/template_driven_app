<main class="appointment-page">
  @if (loading) {
    <p class="state">Loading barber profile...</p>
  }
  @if (barber(); as profile) {
    <app-barber-profile-header [barber]="profile"></app-barber-profile-header>
    <section class="booking-panel" aria-labelledby="booking-title">
      <p class="eyebrow">Appointments</p>
      <h2 id="booking-title">Book a visit</h2>
      <form [formGroup]="bookingForm" (ngSubmit)="book()">
        <div class="form-fields">
          <label
            >Service
            <select formControlName="serviceId" (change)="loadAvailability()">
              @for (service of services(); track service.id) {
                <option [value]="service.id">
                  {{ service.name }} · {{ service.durationMinutes }} min ·
                  {{ service.price }} RON
                </option>
              }
            </select>
          </label>
          <label
            >Date
            <input
              type="date"
              formControlName="date"
              [min]="bookingForm.controls.date.value"
              (change)="loadAvailability()"
            />
          </label>
        </div>
        <app-time-slot-picker
          [availability]="availability()"
          [selectedTime]="selectedTime"
          (timeSelected)="selectedTime = $event"
        ></app-time-slot-picker>
        @if (!auth.currentUserValue?.token) {
          <app-guest-details-form
            [group]="bookingForm.controls.guestDetails"
            [submitted]="submitted"
          ></app-guest-details-form>
        }
        <app-action-button
          buttonType="submit"
          [config]="confirmAppointmentConfig"
          [isLoading]="booking"
        ></app-action-button>
        @if (message) {
          <p class="success">{{ message }}</p>
        }
        @if (error) {
          <p class="error">{{ error }}</p>
        }
      </form>
    </section>
  } @else if (!loading) {
    <p class="state">{{ error }}</p>
  }
</main>
