<main class="admin-page" [style]="tenantStyles()">
  <div class="admin-content">
    <p class="eyebrow">Admin</p>
    <h1>Admin</h1>

    <div class="admin-save-bar">
      <span class="save-scope">Changes apply to all admin sections</span>
      <div class="save-actions">
        @if (saved) {
          <span class="success-message">Changes saved.</span>
        }
        @if (error) {
          <span class="error-message">{{ error }}</span>
        }
        <app-action-button
          [config]="{
            label: 'Save changes',
            loadingLabel: 'Saving...',
            variant: 'primary',
          }"
          [isLoading]="saving"
          (action)="saveContent()"
        ></app-action-button>
      </div>
    </div>

    <app-pricing-plans-editor
      [model]="pricing"
      [services]="services"
    ></app-pricing-plans-editor>

    <app-hero-section-editor [model]="hero"></app-hero-section-editor>

    <app-about-us-editor [model]="about"></app-about-us-editor>

    <app-contact-details-editor [model]="contact"></app-contact-details-editor>
  </div>
</main>
