<section class="hero-background" [ngStyle]="tenantStyles()">
  <div class="hero-media">
    <div class="hero-backdrop"></div>
  </div>

  <div class="hero-top">
    <div class="hero-badge">404 • Page Not Found</div>

    <h1>Looks like you're lost.</h1>

    <p class="hero-subtitle">
      The page you're looking for doesn't exist, may have been moved, or you
      don't have permission to access it.
    </p>

    <div class="hero-actions">
      <app-action-button
        [config]="{ label: 'Back to Home', variant: 'primary', size: 'lg' }"
        (action)="goHome()"
      ></app-action-button>

      <app-action-button
        [config]="{ label: 'Go Back', variant: 'secondary', size: 'lg' }"
        (action)="goBack()"
      ></app-action-button>
    </div>
  </div>
</section>
