<section class="schedule-section" aria-labelledby="schedule-title">
  <app-working-hours-editor
    [days]="days()"
    [saved]="saved()"
    (dayChange)="updateDay($event.day, $event.field, $event.value)"
    (save)="saveSchedule()"
  ></app-working-hours-editor>

  <app-barber-services-manager
    [services]="services()"
    (addService)="addService($event)"
    (updateService)="updateService($event)"
    (deleteService)="deleteService($event)"
  ></app-barber-services-manager>

  <app-blocked-time-manager
    [blockedPeriods]="blockedPeriods()"
    (block)="blockTime($event)"
    (unblock)="unblockTime($event)"
    (editPeriod)="editBlockedTime($event)"
  ></app-blocked-time-manager>

  @if (error) {
    <p class="error">{{ error }}</p>
  }
</section>
