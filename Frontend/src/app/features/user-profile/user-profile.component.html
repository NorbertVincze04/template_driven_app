<main class="profile-page" [style]="tenantStyles()">
  <section class="profile-content" aria-labelledby="profile-title">
    <p class="eyebrow">{{ tenantConfig()?.name || "Your account" }}</p>
    <h1 id="profile-title">User profile</h1>
    <div class="profile-details">
      @if (currentUser()?.profileImageUrl) {
        <img
          class="profile-avatar"
          [src]="currentUser()!.profileImageUrl!"
          [alt]="currentUser()?.name || 'Profile'"
        />
      } @else {
        <span class="profile-avatar profile-fallback" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          >
            <circle cx="12" cy="8" r="3.25" />
            <path d="M5.5 20c.8-3.1 3.1-4.75 6.5-4.75s5.7 1.65 6.5 4.75" />
          </svg>
        </span>
      }
      <div class="identity">
        <h2>{{ currentUser()?.name || "User" }}</h2>
        <p>{{ currentUser()?.email }}</p>
        <span class="role">{{ currentUser()?.type }}</span>
      </div>
    </div>
  </section>
</main>
